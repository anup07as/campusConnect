<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Now - CampusConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="CampusConnect Logo">
            <h2>CampusConnect</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="#">About</a>
            <a href="signin.html" class="signin-btn">Sign In</a>
            <a href="join.html" class="join-btn">Join Now</a>
        </div>
    </nav>

    <main class="signin-page">
        <div class="signin-card">
            <h1>Join CampusConnect 🚀</h1>
            <p>Create your account and start learning.</p>
            <form id="join-form">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
                <label for="password">Password</label>
                <input
                   type="password"
                     id="password"
                     placeholder="Create a password"
                     minlength="8"
                     required  
                >
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >
                <button type="submit">
                    Create Account
                </button>
            </form>
            <p class="signup-text">
                Already have an account?
                <a href="signin.html">Sign In</a>
            </p>
        </div>
    </main>
    <script>
const joinForm = document.getElementById("join-form");

joinForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm-password").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    const user = {
        name: name,
        email: email,
        password: password
    };

    fetch("http://127.0.0.1:8080/api/auth/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })

    .then(async response => {
    if (!response.ok) {
        const errorMessage = await response.text();
        if (errorMessage.includes("Email already registered")) {
            throw new Error("Email already registered");
        }
        throw new Error("Registration failed");
    }
    return response.json();
})

    .then(data => {
        alert("Account created successfully!");

        joinForm.reset();
    })

   .catch(error => {

    console.error("Registration error:", error);

    if (error.message === "Email already registered") {
        alert("Email already registered. Please use another email.");
    } else {
        alert("Unable to create account.");
    }
});
});
</script>
</body>
</html>
