<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Now - CampusConnect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="CampusConnect Logo">
            <h2>CampusConnect</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="#">About</a>
            <a href="signin.html" class="signin-btn">Sign In</a>
            <a href="join.html" class="join-btn">Join Now</a>
        </div>
    </nav>

    <main class="signin-page">
        <div class="signin-card">
            <h1>Join CampusConnect 🚀</h1>
            <p>Create your account and start learning.</p>
            <form id="join-form">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
                <label for="password">Password</label>
                <input
                   type="password"
                     id="password"
                     placeholder="Create a password"
                     minlength="8"
                     required  
                >
                <label for="confirm-password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >
               <button type="submit" id="create-account-btn">
    Create Account
</button>

<div id="otp-section" style="display: none; margin-top: 20px;">

    <label for="otp">Email Verification OTP</label>

    <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
        inputmode="numeric"
    >

    <button type="button" id="verify-otp-btn">
        Verify OTP
    </button>

    <p style="font-size: 13px; margin-top: 8px;">
        Check your email for the 6-digit verification code.
    </p>

</div>
            </form>
            <p class="signup-text">
                Already have an account?
                <a href="signin.html">Sign In</a>
            </p>
        </div>
    </main>
  <script>
const joinForm = document.getElementById("join-form");

const otpSection =
    document.getElementById("otp-section");

const verifyOtpButton =
    document.getElementById("verify-otp-btn");

const createAccountButton =
    document.getElementById("create-account-btn");

let pendingUser = null;


// CREATE ACCOUNT / SEND OTP
joinForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;


    if (password.length < 8) {

        alert("Password must be at least 8 characters.");

        return;
    }


    if (password !== confirmPassword) {

        alert("Passwords do not match!");

        return;
    }


    // Prevent multiple clicks
    createAccountButton.disabled = true;

    createAccountButton.textContent =
        "Sending OTP...";


    // Store user details temporarily
    pendingUser = {

        name: name,
        email: email,
        password: password

    };


    // Send OTP
    fetch(
        "https://campusconnect-8rzy.onrender.com/api/auth/send-otp?email="
        + encodeURIComponent(email),
        {
            method: "POST"
        }
    )

    .then(async response => {

        const message =
            await response.text();


        if (!response.ok) {

            throw new Error(message);

        }


        return message;

    })


    .then(() => {

        alert(
            "OTP sent successfully to "
            + email
        );


        // Show OTP section
        otpSection.style.display = "block";


        // Disable account button
        createAccountButton.disabled = true;

        createAccountButton.textContent =
            "OTP Sent ✓";


        // Focus OTP input
        document.getElementById("otp").focus();

    })


    .catch(error => {

        console.error(
            "OTP error:",
            error
        );


        createAccountButton.disabled = false;

        createAccountButton.textContent =
            "Create Account";


        if (
            error.message ===
            "Email already registered"
        ) {

            alert(
                "Email already registered. Please use another email."
            );

        } else {

            alert(
                "Unable to send OTP. Please check your email and try again."
            );

        }

    });

});


// VERIFY OTP
verifyOtpButton.addEventListener(
    "click",
    function() {

        const otp =
            document.getElementById("otp")
                .value.trim();


        if (!otp) {

            alert("Please enter the OTP.");

            return;
        }


        if (!/^\d{6}$/.test(otp)) {

            alert(
                "Please enter a valid 6-digit OTP."
            );

            return;
        }


        verifyOtpButton.disabled = true;

        verifyOtpButton.textContent =
            "Verifying...";


        fetch(
            "https://campusconnect-8rzy.onrender.com/api/auth/verify-otp?email="
            + encodeURIComponent(
                pendingUser.email
            )
            + "&otp="
            + encodeURIComponent(otp),
            {
                method: "POST"
            }
        )

        .then(async response => {

            const message =
                await response.text();


            if (!response.ok) {

                throw new Error(message);

            }


            return message;

        })


        .then(() => {

            // OTP verified
            verifyOtpButton.textContent =
                "Verified ✓";


            // Create account
            return fetch(
                "https://campusconnect-8rzy.onrender.com/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            pendingUser
                        )
                }
            );

        })


        .then(async response => {

            const message =
                await response.text();


            if (!response.ok) {

                if (
                    message.includes(
                        "Email already registered"
                    )
                ) {

                    throw new Error(
                        "Email already registered"
                    );

                }


                throw new Error(
                    "Registration failed"
                );

            }


            return message;

        })


        .then(() => {

            alert(
                "Account created successfully! 🎉"
            );


            window.location.href =
                "signin.html";

        })


        .catch(error => {

            console.error(
                "Verification error:",
                error
            );


            verifyOtpButton.disabled = false;

            verifyOtpButton.textContent =
                "Verify OTP";


            if (
                error.message ===
                "Invalid or expired OTP"
            ) {

                alert(
                    "Invalid or expired OTP. Please try again."
                );

            } else {

                alert(
                    "Unable to verify OTP or create account."
                );

            }

        });

    }
);
</script>
</body>
</html>
