<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - CampusConnect</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="CampusConnect Logo">
            <h2>CampusConnect</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="about.html">About</a>
            <button id="logout-btn" class="signin-btn">Logout</button>
        </div>
    </nav>
    <main class="admin-page">
        <div class="admin-header">
            <p class="about-label">ADMIN PANEL</p>
            <h1>Welcome, Admin 👑</h1>
            <p>Manage CampusConnect resources and subjects.</p>
        </div>
        <div class="admin-grid">
            <!-- MANAGE SUBJECTS -->
            <div class="about-card">
                <div class="about-icon">📚</div>
                <h2>Manage Subjects</h2>
                <p>Add, edit or delete subjects.</p>
                <button onclick="addSubject()">
                    Add Subject
                </button>
                <select id="admin-semester">
                    <option value="">
                        Select Semester
                    </option>
                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>
                </select>
                <button onclick="loadSubjectsAdmin()">
                    View Subjects
                </button>
                <div
                    id="admin-subject-list"
                    style="margin-top:20px;">
                </div>
                <div
                    id="subject-form"
                    style="display:none; margin-top:20px;">
                    <input
                        type="text"
                        id="subject-name"
                        placeholder="Enter subject name"
                    >
                    <input
                        type="number"
                        id="semester-id"
                        placeholder="Semester number"
                        min="1"
                        max="8"
                    >
                    <button onclick="saveSubject()">
                        Save Subject
                    </button>
                </div>
            </div>
            <!-- MANAGE RESOURCES -->
            <div class="about-card">
                <div class="about-icon">📄</div>
                <h2>Manage Resources</h2>
                <p>Upload and manage study materials.</p>
                <button onclick="addResource()">
                    Add Resource
                </button>
                <div
                    id="resource-form"
                    style="display:none; margin-top:20px;">
                    <input
                        type="text"
                        id="resource-title"
                        placeholder="Enter resource title"
                    >
                    <select id="resource-type">
                        <option value="Notes">
                            Notes
                        </option>
                        <option value="PYQ">
                            PYQ
                        </option>
                        <option value="Important Questions">
                            Important Questions
                        </option>
                    </select>
                    <select id="resource-semester">
                        <option value="">
                            Select Semester
                        </option>
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                    <select id="resource-subject">
                        <option value="">
                            Select Subject
                        </option>
                    </select>
                    <input
                        type="file"
                        id="resource-file"
                        accept=".pdf,application/pdf"
                    >
                    <button onclick="saveResource()">
                        Save Resource
                    </button>
                    <button onclick="loadResources()">
                        View Resources
                    </button>
                    <div
                        id="resource-list"
                        style="margin-top:20px;">
                    </div>
                </div>
            </div>
        </div>
    </main>
<script>
/* =========================
   ADMIN ACCESS
========================= */
const role = localStorage.getItem("userRole");
if (role !== "ADMIN") {
    alert("Access denied. Admin only.");
    window.location.href = "index.html";
}
/* =========================
   LOGOUT
========================= */
document
    .getElementById("logout-btn")
    .addEventListener("click", function () {
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        localStorage.removeItem("userRole");
        localStorage.removeItem("authToken");
        window.location.href = "signin.html";
    });
/* =========================
   ADD SUBJECT
========================= */
function addSubject() {
    document
        .getElementById("subject-form")
        .style.display = "block";
}
function saveSubject() {
    const name =
        document.getElementById("subject-name").value;
    const semesterId =
        document.getElementById("semester-id").value;
    if (!name || !semesterId) {
        alert(
            "Please enter subject name and semester."
        );
        return;
    }
    const subject = {
        name: name,
        semesterId: Number(semesterId)
    };
    fetch(
        "http://127.0.0.1:8080/api/subjects",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")
            },
            body: JSON.stringify(subject)
        }
    )
    .then(response => {
        if (!response.ok) {
            throw new Error("Subject add failed");
        }
        return response.json();
    })
    .then(data => {
        alert(
            "Subject added successfully!"
        );
        document
            .getElementById("subject-name")
            .value = "";
        document
            .getElementById("semester-id")
            .value = "";
    })
    .catch(error => {
        console.error(
            "Subject error:",
            error
        );
        alert(
            "Unable to add subject."
        );
    });
}
/* =========================
   ADD RESOURCE
========================= */
function addResource() {
    document
        .getElementById("resource-form")
        .style.display = "block";
}
function saveResource() {
    const title =
        document
            .getElementById("resource-title")
            .value;
    const type =
        document
            .getElementById("resource-type")
            .value;
    const file =
        document
            .getElementById("resource-file")
            .files[0];
    const subjectId =
        document
            .getElementById("resource-subject")
            .value;
    if (!title || !file || !subjectId) {
        alert(
            "Please fill all fields and select a PDF."
        );
        return;
    }
    const formData = new FormData();
    formData.append("title", title);
    formData.append("type", type);
    formData.append("subjectId", subjectId);
    formData.append("file", file);
    fetch(
        "http://127.0.0.1:8080/api/resources",
        {
            method: "POST",
            headers: {
                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")
            },
            body: formData
        }
    )
    .then(response => {
        if (!response.ok) {
            throw new Error(
                "Upload failed"
            );
        }
        return response.json();
    })
    .then(data => {
        alert(
            "Resource uploaded successfully!"
        );
        document
            .getElementById("resource-title")
            .value = "";
        document
            .getElementById("resource-file")
            .value = "";
        document
            .getElementById("resource-subject")
            .value = "";
    })
    .catch(error => {
        console.error(
            "Resource upload error:",
            error
        );
        alert(
            "Unable to upload resource."
        );
    });
}
/* =========================
   LOAD SUBJECTS FOR RESOURCE
========================= */
function loadSubjects() {
    const semesterSelect =
        document.getElementById(
            "resource-semester"
        );
    const subjectSelect =
        document.getElementById(
            "resource-subject"
        );


    semesterSelect.addEventListener(
        "change",
        function () {

            const semesterId =
                this.value;


            subjectSelect.innerHTML =
                '<option value="">Select Subject</option>';


            if (!semesterId) {

                return;

            }


            fetch(
                "http://127.0.0.1:8080/api/subjects?semester=" +
                semesterId
            )

            .then(response =>
                response.json()
            )

            .then(subjects => {

                subjects.forEach(
                    function(subject) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            subject.id;

                        option.textContent =
                            subject.name;

                        subjectSelect.appendChild(
                            option
                        );

                    }
                );

            })

            .catch(error => {

                console.error(
                    "Subject loading error:",
                    error
                );

                alert(
                    "Unable to load subjects."
                );

            });

        }
    );
}

loadSubjects();


/* =========================
   LOAD RESOURCES
========================= */

function loadResources() {

    const subjectId =
        document
            .getElementById("resource-subject")
            .value;

    const resourceList =
        document
            .getElementById("resource-list");


    if (!subjectId) {

        alert(
            "Please select a subject first."
        );

        return;
    }


    resourceList.innerHTML =
        "<p>Loading resources...</p>";


    fetch(
        "http://127.0.0.1:8080/api/resources?subjectId=" +
        subjectId
    )

    .then(response =>
        response.json()
    )

    .then(resources => {

        resourceList.innerHTML = "";


        if (resources.length === 0) {

            resourceList.innerHTML =
                "<p>No resources found for this subject.</p>";

            return;
        }


        resources.forEach(
            function(resource) {

                resourceList.innerHTML += `

                    <div class="material-item">

                        📄 ${resource.title}

                        <button
                            onclick="editResource(
                                ${resource.id},
                                '${resource.title}',
                                '${resource.type}'
                            )">

                            ✏️ Edit

                        </button>


                        <button
                            onclick="deleteResource(
                                ${resource.id}
                            )">

                            🗑️ Delete

                        </button>

                    </div>

                `;

            }
        );

    })

    .catch(error => {

        console.error(
            "Resource loading error:",
            error
        );

        resourceList.innerHTML =
            "<p>Unable to load resources.</p>";

    });

}


/* =========================
   DELETE RESOURCE
========================= */

function deleteResource(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this resource?"
        );


    if (!confirmDelete) {

        return;

    }


    fetch(
        "http://127.0.0.1:8080/api/resources/" +
        id,
        {
            method: "DELETE",

            headers: {

                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")

            }
        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Delete failed"
            );

        }

        alert(
            "Resource deleted successfully!"
        );

        loadResources();

    })

    .catch(error => {

        console.error(
            "Delete error:",
            error
        );

        alert(
            "Unable to delete resource."
        );

    });

}


/* =========================
   EDIT RESOURCE
========================= */

function editResource(
    id,
    oldTitle,
    oldType
) {

    const newTitle =
        prompt(
            "Enter new resource title:",
            oldTitle
        );


    if (
        !newTitle ||
        newTitle.trim() === ""
    ) {

        return;

    }


    const newType =
        prompt(
            "Enter resource type:",
            oldType
        );


    if (
        !newType ||
        newType.trim() === ""
    ) {

        return;

    }


    const resource = {

        title:
            newTitle.trim(),

        type:
            newType.trim()

    };


    fetch(
        "http://127.0.0.1:8080/api/resources/" +
        id,
        {
            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json",

                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")

            },

            body:
                JSON.stringify(resource)

        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Update failed"
            );

        }

        return response.json();

    })

    .then(data => {

        alert(
            "Resource updated successfully!"
        );

        loadResources();

    })

    .catch(error => {

        console.error(
            "Resource update error:",
            error
        );

        alert(
            "Unable to update resource."
        );

    });

}


/* =========================
   LOAD ADMIN SUBJECTS
========================= */

function loadSubjectsAdmin() {

    const semesterId =
        document
            .getElementById("admin-semester")
            .value;

    const subjectList =
        document
            .getElementById(
                "admin-subject-list"
            );


    if (!semesterId) {

        alert(
            "Please select a semester first."
        );

        return;
    }


    subjectList.innerHTML =
        "<p>Loading subjects...</p>";


    fetch(
        "http://127.0.0.1:8080/api/subjects?semester=" +
        semesterId
    )

    .then(response =>
        response.json()
    )

    .then(subjects => {

        subjectList.innerHTML = "";


        if (subjects.length === 0) {

            subjectList.innerHTML =
                "<p>No subjects found.</p>";

            return;

        }


        subjects.forEach(
            function(subject) {

                subjectList.innerHTML += `

                    <div class="material-item">

                        📚 ${subject.name}

                        <button
                            onclick="editSubject(
                                ${subject.id},
                                '${subject.name}',
                                ${subject.semesterId}
                            )">

                            ✏️ Edit

                        </button>


                        <button
                            onclick="deleteSubject(
                                ${subject.id}
                            )">

                            🗑️ Delete

                        </button>

                    </div>

                `;

            }
        );

    })

    .catch(error => {

        console.error(
            "Subject loading error:",
            error
        );

        subjectList.innerHTML =
            "<p>Unable to load subjects.</p>";

    });

}


/* =========================
   EDIT SUBJECT
========================= */

function editSubject(
    id,
    oldName,
    semesterId
) {

    const newName =
        prompt(
            "Enter new subject name:",
            oldName
        );


    if (
        !newName ||
        newName.trim() === ""
    ) {

        return;

    }


    const subject = {

        name:
            newName.trim(),

        semesterId:
            semesterId

    };


    fetch(
        "http://127.0.0.1:8080/api/subjects/" +
        id,
        {
            method: "PUT",

            headers: {

                "Content-Type":
                    "application/json",

                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")

            },

            body:
                JSON.stringify(subject)

        }
    )

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Update failed"
            );

        }

        return response.json();

    })

    .then(data => {

        alert(
            "Subject updated successfully!"
        );

        loadSubjectsAdmin();

    })

    .catch(error => {

        console.error(
            "Subject update error:",
            error
        );

        alert(
            "Unable to update subject."
        );

    });

}


/* =========================
   DELETE SUBJECT
========================= */

function deleteSubject(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this subject?"
        );


    if (!confirmDelete) {

        return;

    }


    fetch(
        "http://127.0.0.1:8080/api/subjects/" +
        id,
        {
            method: "DELETE",

            headers: {
                "Authorization":
                    "Bearer " +
                    localStorage.getItem("authToken")

            }
        }
    )
    .then(response => {
        if (!response.ok) {
            throw new Error(
                "Delete failed"
            );
        }
        alert(
            "Subject deleted successfully!"
        );
        loadSubjectsAdmin();
    })
    .catch(error => {
        console.error(
            "Subject delete error:",
            error
        );
        alert(
            "Unable to delete subject."
        );
    });
}
</script>
</body>
</html>
