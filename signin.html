<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - CampusConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="brand">
            <img src="logo.png" alt="CampusConnect Logo">
            <h2>CampusConnect</h2>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="#">About</a>
            <a href="signin.html" class="signin-btn">Sign In</a>
            <a href="#" class="join-btn">Join Now</a>
        </div>
    </nav>
    <main class="signin-page">
        <div class="signin-card">
            <h1>Welcome Back 👋</h1>
            <p>Sign in to continue to CampusConnect.</p>
            <form id="signin-form">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
                <button type="submit">
                    Sign In
                </button>
            </form>
            <p class="signup-text">
                Don't have an account?
                <a href="#">Join Now</a>
            </p>
        </div>
    </main>
    <script>
const signinForm = document.getElementById("signin-form");

signinForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const loginUser = {
        email: email,
        password: password
    };

    fetch("http://127.0.0.1:8080/api/auth/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(loginUser)
    })

    .then(response => response.json())

    .then(user => {

       if (user) {

    localStorage.setItem("userName", user.name);
    localStorage.setItem("userEmail", user.email);
    localStorage.setItem("userRole", user.role);

    alert("Login successful! Welcome " + user.name);

    window.location.href = "index.html";
} else {
            alert("Invalid email or password!");
        }

    })

    .catch(error => {

        console.error("Login error:", error);
        alert("Unable to login.");

    });

});
</script>
</body>
</html>
